      function createGridMarkup() {
        if (!state.project.canvas.showGrid) return "";
        const rowCount =
          Math.ceil(state.project.canvas.minHeight / GRID_ROW_HEIGHT) + 2;
        return `
          <div class="grid-overlay">
            ${Array.from({ length: GRID_COLUMNS }, () => '<div class="grid-column"></div>').join("")}
            ${Array.from({ length: rowCount }, (_, i) => `<div class="grid-row" style="top:${i * GRID_ROW_HEIGHT}px"></div>`).join("")}
          </div>
        `;
      }

      function createGridColumnLabelsMarkup() {
        if (!state.project.canvas.showGrid) return "";
        const grid = getGridMetrics();
        return Array.from({ length: GRID_COLUMNS }, (_, i) => {
          const center =
            grid.padding + i * grid.trackШирина + grid.columnШирина / 2;
          return `<span class="grid-col-label" style="left:${center}px;">${i + 1}</span>`;
        }).join("");
      }

      function createGridRowLabelsMarkup() {
        if (!state.project.canvas.showGrid) return "";
        const rowCount = Math.floor(
          state.project.canvas.minHeight / GRID_ROW_HEIGHT,
        );
        return Array.from({ length: rowCount }, (_, i) => {
          const center = i * GRID_ROW_HEIGHT + GRID_ROW_HEIGHT / 2;
          return `<span class="grid-row-label" style="top:${center}px;">${i + 1}</span>`;
        }).join("");
      }

      function decodeNewLines(str) {
        return String(str ?? "").replace(/\\n/g, "\n");
      }

      const HISTORY_LIMIT = 100;
      const history = {
        snapshots: [],
        index: -1,
        applying: false,
      };

      function serializeProject() {
        return JSON.stringify(state.project);
      }

      function writeProjectToLocalStorage(snapshot = serializeProject()) {
        try {
          localStorage.setItem(STORAGE_KEY, snapshot);
        } catch (err) {
          console.warn("Не вдалося зберегти макет у localStorage", err);
        }
      }

      function initializeHistory() {
        const snapshot = serializeProject();
        history.snapshots = [snapshot];
        history.index = 0;
      }

      function commitHistory() {
        if (history.applying) return;

        const snapshot = serializeProject();
        if (history.index >= 0 && history.snapshots[history.index] === snapshot) {
          return;
        }

        if (history.index < history.snapshots.length - 1) {
          history.snapshots.splice(history.index + 1);
        }

        history.snapshots.push(snapshot);

        // 100 кроків скасування + поточний стан.
        const maxSnapshots = HISTORY_LIMIT + 1;
        if (history.snapshots.length > maxSnapshots) {
          history.snapshots.splice(0, history.snapshots.length - maxSnapshots);
        }

        history.index = history.snapshots.length - 1;
      }

      function saveStateToLocalStorage() {
        commitHistory();
        writeProjectToLocalStorage();
      }

      function applyHistorySnapshot(snapshot) {
        history.applying = true;
        try {
          state.project = JSON.parse(snapshot);
          const existingIds = new Set(state.project.elements.map((el) => el.id));
          state.selectedIds = getSelectedIds().filter((id) => existingIds.has(id));
          if (!state.selectedId || !existingIds.has(state.selectedId)) {
            state.selectedId = state.selectedIds[0] || null;
          }

          zCounter = Math.max(
            1,
            ...state.project.elements.map((el) => Number(el.z) || 1),
          );
          normalizeZ();
          writeProjectToLocalStorage(snapshot);
          renderCanvas();
          renderSettings();
          updateComponentStats();
        } finally {
          history.applying = false;
        }
      }

      function undo() {
        if (history.index <= 0) return;
        history.index -= 1;
        applyHistorySnapshot(history.snapshots[history.index]);
      }

      function redo() {
        if (history.index >= history.snapshots.length - 1) return;
        history.index += 1;
        applyHistorySnapshot(history.snapshots[history.index]);
      }

      function restoreStateFromLocalStorage() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (
            !parsed ||
            parsed.type !== "ui-prototype" ||
            !Array.isArray(parsed.elements)
          ) {
            return;
          }

          if (!parsed.canvas) parsed.canvas = {};
          parsed.canvas.width =
            parsed.canvas.width || DEFAULT_PROJECT.canvas.width;
          parsed.canvas.minHeight =
            parsed.canvas.minHeight || DEFAULT_PROJECT.canvas.minHeight;
          parsed.canvas.background = "#ffffff";
          parsed.canvas.name =
            parsed.canvas.name || DEFAULT_PROJECT.canvas.name;
          parsed.canvas.showGrid = !!parsed.canvas.showGrid;

          parsed.elements.forEach((el) => {
            normalizeElementToGrid(el);
            if (!el.props) el.props = {};
            if (!("borderШирина" in el.props))
              el.props.borderШирина = DEFAULT_BORDER_WIDTH;
            if (!("radius" in el.props)) el.props.radius = DEFAULT_RADIUS;
            if (
              el.type === "date-input" &&
              (!Object.prototype.hasOwnProperty.call(el.props, "placeholder") ||
                String(el.props.placeholder ?? "").trim() === "")
            ) {
              el.props.placeholder = "дд.мм.рррр";
            }
            if (
              el.type === "select" &&
              !Object.prototype.hasOwnProperty.call(el.props, "placeholder")
            ) {
              el.props.placeholder = "Оберіть";
            }
            if (
              el.type === "select" &&
              (!Object.prototype.hasOwnProperty.call(el.props, "options") ||
                String(el.props.options ?? "").trim() === "")
            ) {
              el.props.options = "Опція 1\nОпція 2";
            }
          });

          state.project = parsed;
          setSingleSelection(null);
          zCounter = Math.max(
            1,
            ...state.project.elements.map((el) => el.z || 1),
          );
          normalizeZ();
        } catch (err) {
          console.warn("Не вдалося відновити макет із localStorage", err);
        }
      }

      function deleteSelectedElement() {
        const selectedIds = new Set(getSelectedIds());
        if (!selectedIds.size) return;
        state.project.elements = state.project.elements.filter(
          (el) => !selectedIds.has(el.id),
        );
        setSingleSelection(null);
        saveStateToLocalStorage();
        renderCanvas();
        renderSettings();
        updateComponentStats();
      }

      function updateDeleteButtonState() {
        if (!deleteSelectedBtn) return;
        const count = getSelectedIds().length;
        deleteSelectedBtn.disabled = count === 0;
        deleteSelectedBtn.textContent = count > 1 ? `Видалити компоненти (${count})` : "Видалити компонент";
      }

      function renderCatalog() {
        const grouped = {};
        for (const item of componentCatalog) {
          const matches =
            item.name.toLowerCase().includes(state.search) ||
            item.group.toLowerCase().includes(state.search) ||
            item.type.toLowerCase().includes(state.search);
          if (!matches) continue;
          if (!grouped[item.group]) grouped[item.group] = [];
          grouped[item.group].push(item);
        }

        componentList.innerHTML =
          Object.entries(grouped)
            .map(
              ([group, items]) => `
                <div>
                  <div class="group-title">${group}</div>
                  <div class="components-grid">
                    ${items
                      .map(
                        (item) => `
                          <div class="component-card" draggable="true" data-type="${item.type}">
                            
                            <div class="component-name">${item.name}</div>
                          </div>
                        `,
                      )
                      .join("")}
                  </div>
                </div>
              `,
            )
            .join("") || '<div class="muted">Нічого не знайдено.</div>';

        componentList.querySelectorAll(".component-card").forEach((card) => {
          card.addEventListener("dragstart", (e) => {
            dragCatalogType = e.currentTarget.dataset.type;
            e.dataTransfer.setData("text/plain", dragCatalogType);
          });
        });
      }

      function selectedElement() {
        return (
          state.project.elements.find((el) => el.id === state.selectedId) ||
          null
        );
      }

      function addElement(type, x = 40, y = 40) {
        const schema = componentCatalog.find((c) => c.type === type);
        if (!schema) return;

        const gridSpan =
          type === "list"
            ? 2
            : type === "table"
              ? 7
              : type === "directory-tree"
                ? 2
                : type === "number-input" ||
                    type === "date-input" ||
                    type === "select" ||
                    type === "file-input"
                  ? 3
                  : pixelШиринаToGridSpan(schema.size.w);
        const gridCol = pixelXToGridCol(x, gridSpan);
        const gridRow = pixelYToGridRow(y);
        const rowSpan =
          type === "list"
            ? 7
            : type === "table"
              ? 7
              : type === "directory-tree"
                ? 10
                : type === "radio-buttons"
                  ? 1
                  : type === "image"
                    ? 5
                    : type === "textarea"
                      ? 2
                      : type === "line-vertical"
                        ? 10
                        : type === "header"
                          ? 2
                          : type === "paragraph"
                            ? 3
                            : type === "button"
                              ? 2
                              : 1;

        const el = {
          id: crypto.randomUUID(),
          type,
          gridCol,
          gridSpan,
          gridRow,
          rowSpan,
          z: ++zCounter,
          props: structuredClone(schema.defaults),
        };

        state.project.elements.push(el);
        setSingleSelection(el.id);
        saveStateToLocalStorage();
        renderCanvas();
        renderSettings();
        updateComponentStats();
      }

      function renderPalette(propName, currentColor) {
        return `
          <div class="color-palette" data-color-target="${propName}">
            ${COLOR_SWATCHES.map((swatch) => {
              const active =
                normalizeColor(currentColor).toLowerCase() ===
                swatch.value.toLowerCase();
              const whiteClass =
                swatch.value === "#ffffff" ? "border:1px solid #9ca3af;" : "";
              return `<button type="button" class="color-swatch ${active ? "active" : ""}" data-color="${swatch.value}" title="${swatch.name}" aria-label="${swatch.name}" style="background:${swatch.value};${whiteClass}"></button>`;
            }).join("")}
          </div>
        `;
      }

      function formatLabel(label) {
        if (!label) return "";
        return label.replace(
          /\*/g,
          '<span style="color:red;font-weight:700;">*</span>',
        );
      }

      function renderElementContent(el) {
        const p = el.props;
        switch (el.type) {
          case "table": {
            const rows = Math.max(1, Number(p.rows) || 3);
            const cols = Math.max(1, Number(p.cols) || 3);
            const headers = String(p.headers || "")
              .replace(/\\n/g, "\n")
              .split("\n");
            const totalRows = rows + 1;
            const cellHeight = (100 / totalRows).toFixed(4) + "%";
            let tableHtml =
              '<table style="width:100%;height:100%;border-collapse:collapse;table-layout:fixed;">';

            tableHtml += "<tr>";
            for (let c = 0; c < cols; c++) {
              tableHtml += `<th style="height:${cellHeight};border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};padding:4px;background:#f3f4f6;font-weight:600;font-size:12px;text-align:left;vertical-align:middle;">${escapeHtml(headers[c] || "")}</th>`;
            }
            tableHtml += "</tr>";

            for (let r = 0; r < rows; r++) {
              tableHtml += "<tr>";
              for (let c = 0; c < cols; c++) {
                tableHtml += `<td style="height:${cellHeight};border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};padding:4px;vertical-align:middle;"></td>`;
              }
              tableHtml += "</tr>";
            }

            tableHtml += "</table>";
            return `<div style="width:100%;height:100%;background:${p.bgColor};border-radius:${p.radius}px;color:${p.color};overflow:hidden;">${tableHtml}</div>`;
          }

          case "header": {
            const isDarkBg = ["#000000", "#5f7fa6"].includes(
              (p.bgColor || "").toLowerCase(),
            );
            const textColor = isDarkBg ? "#ffffff" : p.color;
            return `<div style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:${justifyFromAlign(p.textAlign)};font-size:${p.fontSize}px;font-weight:${p.fontWeight};color:${textColor};text-align:${p.textAlign};background:${p.bgColor};border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-radius:${p.radius}px;padding:4px 8px;overflow:hidden;white-space:pre-wrap;">${escapeHtml(String(p.text || "").replace(/\\n/g, "\n"))}</div>`;
          }

          case "paragraph":
            return `<div style="width:100%;height:100%;display:flex;align-items:flex-start;justify-content:${justifyFromAlign(p.textAlign)};font-size:${p.fontSize}px;font-weight:${p.fontWeight};color:${p.color};text-align:${p.textAlign};background:${p.bgColor};border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-radius:${p.radius}px;padding:4px 8px;overflow:hidden;white-space:pre-wrap;">${escapeHtml(String(p.text || "").replace(/\\n/g, "\n"))}</div>`;

          case "button":
            return `<button style="font-size:${p.fontSize}px;font-weight:${p.fontWeight};color:${p.color};background:${p.bgColor};border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-radius:${p.radius}px;">${escapeHtml(decodeNewLines(p.text))}</button>`;

          case "number-input":
            return `<div class="proto-field">
              <div class="proto-field-label">${formatLabel(escapeHtml(decodeNewLines(p.label || "")))}</div>
              <div style="display:flex;width:100%;height:100%;">
                <input
                  class="proto-field-input"
                  type="number"
                  style="flex:1;min-width:0;color:${p.color};--placeholder-color:${p.color};font-size:13px;background:${p.bgColor};border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-right:none;border-radius:${p.radius}px 0 0 ${p.radius}px;padding:0 12px;font-family:inherit;"
                  placeholder="${escapeAttr(decodeNewLines(p.placeholder || ""))}"
                />
                <div style="flex:0 0 36px;height:100%;display:flex;align-items:center;justify-content:center;background:#f3f4f6;border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-radius:0 ${p.radius}px ${p.radius}px 0;">
                  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 10l4-4 4 4"></path>
                    <path d="M8 14l4 4 4-4"></path>
                  </svg>
                </div>
              </div>
            </div>`;

          case "file-input":
            return `<div class="proto-field">
              <div class="proto-field-label">${formatLabel(escapeHtml(decodeNewLines(p.label || "")))}</div>
              <div style="display:flex;width:100%;height:100%;align-items:center;overflow:hidden;background:${p.bgColor};border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-radius:${p.radius}px;">
                <div style="flex:1;min-width:0;padding:0 12px;color:${p.color};font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit;">${escapeHtml(decodeNewLines(p.placeholder || "Оберіть файл(и)"))}</div>
                <div style="flex:0 0 36px;height:100%;display:flex;align-items:center;justify-content:center;padding:0;${getBorderSideCss("border-left", p.borderColor, p.borderШирина, "solid")};background:#f3f4f6;color:#374151;">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3v12"></path>
                    <path d="M7 10l5 5 5-5"></path>
                    <path d="M5 21h14"></path>
                  </svg>
                </div>
              </div>
            </div>`;

          case "text-input":
            return `<div class="proto-field">
              <div class="proto-field-label">${formatLabel(escapeHtml(decodeNewLines(p.label || "")))}</div>
              <input
                class="proto-field-input"
                type="text"
                style="color:${p.color};--placeholder-color:${p.color};font-size:13px;background:${p.bgColor};border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-radius:${p.radius}px;padding:0 12px;font-family:inherit;"
                placeholder="${escapeAttr(decodeNewLines(p.placeholder || ""))}"
              />
            </div>`;

          case "date-input":
            return `<div class="proto-field">
              <div class="proto-field-label">${formatLabel(escapeHtml(decodeNewLines(p.label || "")))}</div>
              <div style="display:flex;width:100%;height:100%;">
                <input
                  class="proto-field-input"
                  type="text"
                  inputmode="numeric"
                  placeholder="${escapeAttr(decodeNewLines(p.placeholder || "dd.MM.yyyy"))}"
                  style="flex:1;min-width:0;color:${p.color};--placeholder-color:${p.color};font-size:13px;background:${p.bgColor};border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-right:none;border-radius:${p.radius}px 0 0 ${p.radius}px;padding:0 12px;"
                />
                <div style="flex:0 0 36px;height:100%;display:flex;align-items:center;justify-content:center;background:#f3f4f6;border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-radius:0 ${p.radius}px ${p.radius}px 0;">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                  </svg>
                </div>
              </div>
            </div>`;

          case "category-input":
            return `<div class="proto-field">
              <div class="proto-field-label">${formatLabel(escapeHtml(decodeNewLines(p.label || "")))}</div>
              <div style="display:flex;width:100%;height:100%;">
                <input
                  class="proto-field-input"
                  type="text"
                  style="flex:1;min-width:0;color:${p.color};--placeholder-color:${p.color};font-size:13px;background:${p.bgColor};border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-right:none;border-radius:${p.radius}px 0 0 ${p.radius}px;padding:0 12px;"
                  placeholder="${escapeAttr(decodeNewLines(p.placeholder || ""))}"
                />
                <div
                  style="width:36px;height:100%;display:flex;align-items:center;justify-content:center;background:#f3f4f6;border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-radius:0 ${p.radius}px ${p.radius}px 0;flex:0 0 36px;font-weight:700;color:#374151;"
                >...</div>
              </div>
            </div>`;

          case "textarea":
            return `<div class="proto-field proto-field-textarea" style="color:${p.color};">
              <div class="proto-field-label">${formatLabel(escapeHtml(decodeNewLines(p.label || "")))}</div>
              <textarea class="proto-field-input" style="color:${p.color};--placeholder-color:${p.color};font-size:12px;background:${p.bgColor};border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-radius:${p.radius}px;padding:10px 12px 18px 12px;" placeholder="${escapeAttr(decodeNewLines(p.placeholder || ""))}"></textarea>
              <span class="textarea-corner-mark" aria-hidden="true"></span>
            </div>`;

          case "checkbox": {
            const boxBorderColor = p.checked ? "#f97316" : "#a3a3a3";
            const boxBgColor = p.checked ? "#f97316" : "#ffffff";
            return `<div style="width:100%;height:100%;display:flex;align-items:center;gap:10px;color:${p.color};font-size:${p.fontSize}px;background:${p.bgColor};">
              <span aria-hidden="true" style="width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 18px;border:1px solid ${boxBorderColor};border-radius:4px;background:${boxBgColor};box-shadow:none;">
                ${p.checked ? '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ""}
              </span>
              <span style="font-size:${p.fontSize}px;line-height:1.2;">${escapeHtml(decodeNewLines(p.text))}</span>
            </div>`;
          }

          case "radio-buttons": {
            const options = String((p.options || "").replace(/\\n/g, "\n"))
              .split("\n")
              .map((opt) => opt.trim())
              .filter(Boolean);
            const selectedIndex = Math.max(
              0,
              Math.min(
                Number(p.selectedIndex) || 0,
                Math.max(options.length - 1, 0),
              ),
            );
            const orientation =
              p.orientation === "vertical" ? "vertical" : "horizontal";

            return `<div class="radio-group-ui ${orientation}" style="color:${p.color};background:${p.bgColor};">
              ${options
                .map(
                  (opt, i) => `<label class="radio-option-ui">
                    <input type="radio" name="radio-${el.id}" ${i === selectedIndex ? "checked" : ""} />
                    <span>${escapeHtml(opt)}</span>
                  </label>`,
                )
                .join("")}
            </div>`;
          }

          case "select":
            return `<div class="proto-field">
              <div class="proto-field-label">${formatLabel(escapeHtml(decodeNewLines(p.label || "")))}</div>
              <div style="display:flex;width:100%;height:100%;">
                <select class="proto-field-input" style="flex:1;min-width:0;color:${p.color};background:${p.bgColor};border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-right:none;border-radius:${p.radius}px 0 0 ${p.radius}px;padding:0 12px;font-size:13px;">
                  <option value="" disabled selected>${escapeHtml(decodeNewLines(p.placeholder || "Оберіть"))}</option>
                  ${(p.options || "")
                    .split("\n")
                    .filter(Boolean)
                    .map((opt) => `<option>${escapeHtml(opt)}</option>`)
                    .join("")}
                </select>
                <div style="flex:0 0 36px;height:100%;display:flex;align-items:center;justify-content:center;background:#f3f4f6;border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-radius:0 ${p.radius}px ${p.radius}px 0;">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </div>
              </div>
            </div>`;

          case "line-vertical":
            return `<div style="width:100%;height:100%;display:flex;justify-content:center;">
              <div style="width:0;height:100%;${getBorderSideCss("border-left", p.borderColor, p.borderШирина, "solid")};"></div>
            </div>`;

          case "line-horizontal":
            return `<div style="width:100%;height:100%;display:flex;align-items:center;">
              <div style="width:100%;height:0;${getBorderSideCss("border-top", p.borderColor, p.borderШирина, "solid")};"></div>
            </div>`;

          case "tabs":
            return `<div style="width:100%;height:100%;display:flex;gap:6px;align-items:flex-end;${getBorderSideCss("border-bottom", p.borderColor, p.borderШирина, "solid")};">
              ${(p.tabs || "")
                .replace(/\\n/g, "\n")
                .split("\n")
                .filter(Boolean)
                .map((t, i) => {
                  const active = i === (p.activeIndex || 0);
                  const isDarkBg = ["#000000", "#5f7fa6"].includes(
                    String(p.bgColor || "").toLowerCase(),
                  );
                  const textColor = active && isDarkBg ? "#ffffff" : p.color;
                  return `<div style="
                  padding:6px 10px;
                  border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};
                  border-bottom:${active ? "0" : getBorderCss(p.borderColor, p.borderШирина, "solid")};
                  border-radius:${p.radius}px ${p.radius}px 0 0;
                  background:${active ? p.bgColor : "#f3f4f6"};
                  color:${textColor};
                  font-size:14px;
                  font-weight:${active ? "700" : "400"};
                ">${escapeHtml(t)}</div>`;
                })
                .join("")}
            </div>`;
          case "list": {
            const lines = String((p.items || "").replace(/\\n/g, "\n"))
              .split("\n")
              .filter((line) => line.trim().length);
            const titleHtml = p.title
              ? `<div style="font-size:13px;font-weight:700;color:${p.color};margin-bottom:8px;">${escapeHtml(p.title)}</div>`
              : "";
            const titleOffset = p.title ? 24 : 0;
            const listHtml = lines
              .map((line) => {
                const indentMatch = line.match(/^\s*/);
                const indent = indentMatch ? indentMatch[0].length : 0;
                const level = Math.floor(indent / 2);
                return `<div style="display:flex;align-items:flex-start;gap:6px;padding:2px 0 2px ${level * 16}px;font-size:13px;line-height:1.4;color:${p.color};">
                  <span style="flex:0 0 auto;">•</span>
                  <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(line.trim())}</span>
                </div>`;
              })
              .join("");
            return `<div style="width:100%;height:100%;background:${p.bgColor};border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-radius:${p.radius}px;padding:12px;overflow:hidden;">
              ${titleHtml}
              <div style="height:calc(100% - ${titleOffset}px);overflow:hidden;">${listHtml}</div>
            </div>`;
          }

          case "directory-tree": {
            const lines = String((p.items || "").replace(/\\n/g, "\n"))
              .split("\n")
              .filter((line) => line.trim().length);
            const treeHtml = lines
              .map((line) => {
                const indentMatch = line.match(/^\s*/);
                const indent = indentMatch ? indentMatch[0].length : 0;
                const level = Math.floor(indent / 2);
                const name = line.trim();
                const isFile = /\.[a-z0-9]+$/i.test(name);
                return `<div style="display:flex;align-items:center;gap:8px;padding:2px 0 2px ${level * 18}px;font-size:13px;line-height:1.4;color:${p.color};">
                  <span style="width:16px;text-align:center;flex:0 0 16px;">${isFile ? "📄" : "📁"}</span>
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(name)}</span>
                </div>`;
              })
              .join("");
            return `<div style="width:100%;height:100%;background:${p.bgColor};border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-radius:${p.radius}px;padding:12px;overflow:hidden;">
              <div style="font-size:14px;font-weight:700;color:${p.color};margin-bottom:8px;">${escapeHtml(decodeNewLines(p.title || ""))}</div>
              <div style="height:calc(100% - 24px);overflow:hidden;">${treeHtml}</div>
            </div>`;
          }

          case "image":
            return `<div class="image-ui" style="background:${p.bgColor};border:${getBorderCss(p.borderColor, p.borderШирина, "dashed")};border-radius:${p.radius}px;color:${p.color};text-align:${p.textAlign};">${escapeHtml(decodeNewLines(p.text))}</div>`;

          case "card":
            return `<div class="card-ui" style="background:${p.bgColor};border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-radius:${p.radius}px;color:${p.color};text-align:${p.textAlign};"><div style="font-size:${p.fontSize}px;font-weight:${p.fontWeight};margin-bottom:10px;">${escapeHtml(decodeNewLines(p.text))}</div><div style="font-size:14px;color:#6b7280;">Місце для контенту, опису, кнопок і медіа.</div></div>`;

          case "section":
            return `<div class="section-ui" style="background:${p.bgColor};border:${getBorderCss(p.borderColor, p.borderШирина, "dashed")};border-radius:${p.radius}px;color:${p.color};text-align:${p.textAlign};"><div style="font-size:${p.fontSize}px;font-weight:${p.fontWeight};margin-bottom:10px;">${escapeHtml(decodeNewLines(p.text))}</div><div style="font-size:14px;color:#6b7280;">Контейнер для групування блоків сторінки.</div></div>`;

          case "form":
            return `<div class="form-ui" style="background:${p.bgColor};border:${getBorderCss(p.borderColor, p.borderШирина, "solid")};border-radius:${p.radius}px;color:${p.color};text-align:${p.textAlign};"><div style="font-size:${p.fontSize}px;font-weight:${p.fontWeight};margin-bottom:14px;">${escapeHtml(decodeNewLines(p.text))}</div><div style="display:grid;gap:10px;"><input placeholder="Ім'я" style="padding:10px 12px;border:1px solid #000000;border-radius:10px;color:#6b7280;--placeholder-color:#6b7280;background:#ffffff;pointer-events:none;"><input placeholder="Email" style="padding:10px 12px;border:1px solid #000000;border-radius:10px;color:#6b7280;--placeholder-color:#6b7280;background:#ffffff;pointer-events:none;"><button style="padding:10px 12px;background:#ef4444;color:#fff;border:none;border-radius:10px;pointer-events:none;">Надіслати</button></div></div>`;

          default:
            return `<div>Unknown element</div>`;
        }
      }

      function renderCanvas() {
        canvas.style.width = state.project.canvas.width + "px";
        canvas.style.minHeight = state.project.canvas.minHeight + "px";
        canvas.style.background = "#ffffff";
        canvas.classList.toggle("empty", state.project.elements.length === 0);

        gridCols.style.width = state.project.canvas.width + "px";
        gridRows.style.height = state.project.canvas.minHeight + "px";
        gridCols.innerHTML = createGridColumnLabelsMarkup();
        gridRows.innerHTML = createGridRowLabelsMarkup();

        const children = state.project.elements
          .slice()
          .sort((a, b) => a.z - b.z)
          .map((el) => {
            normalizeElementToGrid(el);

            const left = gridColToPixelX(el.gridCol);
            const top = gridRowToPixelY(el.gridRow);
            const width = gridSpanToPixelШирина(el.gridSpan);
            const height = rowSpanToPixelHeight(el.rowSpan);
            return `
              <div class="canvas-element ${getSelectedIds().includes(el.id) ? "selected" : ""}" data-id="${el.id}"
                style="left:${left}px;top:${top}px;width:${width}px;height:${height}px;z-index:${el.z};">
                ${renderElementContent(el)}
                <div class="resize"></div>
              </div>
            `;
          })
          .join("");

        canvas.innerHTML =
          createGridMarkup() +
          '<div class="drop-hint"></div>' +
          (state.project.elements.length ? children : createEmptyStateMarkup());

        gridToggle.checked = !!state.project.canvas.showGrid;
        updateDeleteButtonState();

        canvas.querySelectorAll(".canvas-element").forEach((node) => {
          node.addEventListener("mousedown", startElementDrag);
          node.addEventListener("click", (evt) => evt.stopPropagation());
          const resizeHandle = node.querySelector(".resize");
          if (resizeHandle) {
            resizeHandle.addEventListener("mousedown", startResize);
          }
        });
      }

      function renderSettings() {
        const selectedCount = getSelectedIds().length;
        const el = selectedElement();
        if (selectedCount > 1) {
          settingsBody.innerHTML = `
            <div class="settings-placeholder">
              Виділено компонентів: <strong>${selectedCount}</strong>.<br />
              Перетягуйте будь-який виділений компонент для групового переміщення.
              Ctrl/⌘ або Shift + клік додає чи прибирає компонент із групи.
            </div>
          `;
          return;
        }
        if (!el) {
          settingsBody.innerHTML = `
            ${renderCanvasSettings()}
            <div class="field">
              <label>Компоненти</label>
              ${renderComponentStatsGrouped()}
            </div>
          `;
          attachSettingsListeners();
          attachPaletteListeners();
          return;
        }

        normalizeElementToGrid(el);
        const p = el.props;

        settingsBody.innerHTML = `
          <div class="field">
            <label>Тип</label>
            <input value="${escapeAttr(el.type)}" disabled />
          </div>
          <div class="two-col" style="grid-template-columns: repeat(4, 1fr);">
            <div class="field"><label>Рядок</label><input data-bind="gridRow" type="number" value="${el.gridRow}" min="1" /></div>
            <div class="field"><label>Колонка</label><input data-bind="gridCol" type="number" value="${el.gridCol}" min="1" max="${GRID_COLUMNS}" /></div>
            <div class="field"><label>Ширина</label><input data-bind="gridSpan" type="number" value="${el.gridSpan}" min="${MIN_GRID_SPAN}" max="${GRID_COLUMNS}" /></div>
            <div class="field"><label>Висота</label><input data-bind="rowSpan" type="number" value="${el.rowSpan}" min="${MIN_ROW_SPAN}" /></div>
          </div>
          ${typeof p.text !== "undefined" && el.type !== "tabs" ? `<div class="field"><label>Text</label><textarea data-prop="text">${escapeHtml(decodeNewLines(p.text))}</textarea></div>` : ""}
          ${typeof p.title !== "undefined" ? `<div class="field"><label>Title</label><input data-prop="title" value="${escapeAttr(decodeNewLines(p.title))}" /></div>` : ""}
          ${typeof p.items !== "undefined" ? `<div class="field"><label>Items</label><textarea data-prop="items" ${el.type === "directory-tree" || el.type === "list" ? 'rows="13"' : ""}>${escapeHtml((p.items || "").replace(/\\n/g, "\n"))}</textarea></div>` : ""}
          ${typeof p.label !== "undefined" ? `<div class="field"><label>Label</label><input data-prop="label" value="${escapeAttr(decodeNewLines(p.label))}" /></div>` : ""}
          ${typeof p.placeholder !== "undefined" || el.type === "select" ? `<div class="field"><label>Placeholder</label><input data-prop="placeholder" value="${escapeAttr(decodeNewLines(el.type === "date-input" && !String(p.placeholder || "").trim() ? "дд.мм.рррр" : el.type === "select" ? p.placeholder || "Оберіть" : p.placeholder))}" /></div>` : ""}
          ${typeof p.options !== "undefined" && el.type !== "select" ? `<div class="field"><label>Options (one per line)</label><textarea data-prop="options">${escapeHtml((p.options || "").replace(/\\n/g, "\n"))}</textarea></div>` : ""}
          ${typeof p.tabs !== "undefined" && el.type !== "table" ? `<div class="field"><label>Tabs (one per line)</label><textarea data-prop="tabs" rows="10">${escapeHtml((p.tabs || "").replace(/\\n/g, "\n"))}</textarea></div>` : ""}
          ${typeof p.activeIndex !== "undefined" ? `<div class="field"><label>Active tab</label><input data-prop="activeIndex" type="number" min="0" value="${p.activeIndex}" /></div>` : ""}
          ${typeof p.checked !== "undefined" ? `<div class="field"><label>Checked</label><select data-prop="checked"><option value="false" ${!p.checked ? "selected" : ""}>false</option><option value="true" ${p.checked ? "selected" : ""}>true</option></select></div>` : ""}
          ${typeof p.selectedIndex !== "undefined" ? `<div class="field"><label>Selected index</label><input data-prop="selectedIndex" type="number" min="0" value="${p.selectedIndex}" /></div>` : ""}
          ${typeof p.orientation !== "undefined" ? `<div class="field"><label>Orientation</label><select data-prop="orientation"><option value="horizontal" ${p.orientation === "horizontal" ? "selected" : ""}>horizontal</option><option value="vertical" ${p.orientation === "vertical" ? "selected" : ""}>vertical</option></select></div>` : ""}
          ${typeof p.fontSize !== "undefined" ? `<div class="two-col"><div class="field"><label>Font size</label><input data-prop="fontSize" type="number" value="${p.fontSize}" /></div><div class="field"><label>Font weight</label><input data-prop="fontWeight" type="number" value="${p.fontWeight}" /></div></div>` : ""}
          ${typeof p.textAlign !== "undefined" ? `<div class="field"><label>Text align</label><select data-prop="textAlign"><option ${p.textAlign === "left" ? "selected" : ""} value="left">left</option><option ${p.textAlign === "center" ? "selected" : ""} value="center">center</option><option ${p.textAlign === "right" ? "selected" : ""} value="right">right</option></select></div>` : ""}
          ${
            el.type === "table"
              ? `
            <div class="two-col">
              <div class="field"><label>Rows</label><input data-prop="rows" type="number" min="1" value="${p.rows || 3}" /></div>
              <div class="field"><label>Columns</label><input data-prop="cols" type="number" min="1" value="${p.cols || 3}" /></div>
            </div>
            <div class="field">
              <label>Headers (one per line)</label>
              <textarea data-prop="headers" rows="13">${escapeHtml((p.headers || "").replace(/\\n/g, "\n"))}</textarea>
            </div>
            ${typeof p.bgColor !== "undefined" ? `<div class="field"><label>Бекграунд</label>${renderPalette("bgColor", p.bgColor)}</div>` : ""}
            ${typeof p.borderColor !== "undefined" ? `<div class="field"><label>Колір рамки</label>${renderPalette("borderColor", p.borderColor)}</div>` : ""}
            ${typeof p.color !== "undefined" ? `<div class="field"><label>Колір тексту</label>${renderPalette("color", p.color)}</div>` : ""}
          `
              : `
            ${typeof p.bgColor !== "undefined" ? `<div class="field"><label>Бекграунд</label>${renderPalette("bgColor", p.bgColor)}</div>` : ""}
            ${typeof p.borderColor !== "undefined" ? `<div class="field"><label>Колір рамки</label>${renderPalette("borderColor", p.borderColor)}</div>` : ""}
            ${typeof p.color !== "undefined" ? `<div class="field"><label>Колір тексту</label>${renderPalette("color", p.color)}</div>` : ""}
          `
          }
          
        `;
        attachSettingsListeners();
        attachPaletteListeners();
      }

      function renderComponentStatsGrouped() {
        const groupOrder = ["Текст", "Форма", "Контейнери", "Медіа"];
        const grouped = {};
        for (const group of groupOrder) grouped[group] = {};

        for (const el of state.project.elements) {
          const schema = componentCatalog.find((c) => c.type === el.type);
          if (!schema) continue;
          if (!grouped[schema.group]) grouped[schema.group] = {};
          grouped[schema.group][schema.name] =
            (grouped[schema.group][schema.name] || 0) + 1;
        }

        const total = state.project.elements.length;
        const groupsMarkup = groupOrder
          .map((group) => {
            const items = grouped[group] || {};
            const names = Object.keys(items).sort((a, b) =>
              a.localeCompare(b, "uk"),
            );

            const listMarkup = names.length
              ? `<div style="margin-top:4px;padding-left:14px;">${names
                  .map(
                    (name) =>
                      `<div style="margin:2px 0;">• ${name}: ${items[name]}</div>`,
                  )
                  .join("")}</div>`
              : `<div style="margin-top:4px;padding-left:14px;color:#6b7280;">—</div>`;

            return `<div style="margin-bottom:10px;">
              <strong>${group}</strong>
              ${listMarkup}
            </div>`;
          })
          .join("");

        return `
          <div style="font-size:13px;color:#374151;">
            <div style="margin-bottom:8px;"><strong>Усього:</strong> ${total}</div>
            ${groupsMarkup}
          </div>
        `;
      }

      function renderCanvasSettings() {
        const c = state.project.canvas;
        return `
          <div class="group-title" style="margin-top:0;">Полотно</div>
          
          <div class="two-col">
            <div class="field"><label>Ширина</label><input data-canvas="width" type="number" value="${c.width}" min="320" /></div>
            <div class="field"><label>Висота</label><input data-canvas="minHeight" type="number" value="${c.minHeight}" min="320" /></div>
          </div>
        `;
      }

      function attachPaletteListeners() {
        settingsBody
          .querySelectorAll("[data-color-target]")
          .forEach((palette) => {
            palette.querySelectorAll(".color-swatch").forEach((swatch) => {
              swatch.addEventListener("click", () => {
                const color = swatch.dataset.color;
                const target = palette.dataset.colorTarget;
                const el = selectedElement();
                if (!el) return;
                el.props[target] = color;
                saveStateToLocalStorage();
                renderCanvas();
                renderSettings();
                updateComponentStats();
              });
            });
          });
      }

      function attachSettingsListeners() {
        const boundElementId = state.selectedId;

        settingsBody.querySelectorAll("[data-bind]").forEach((input) => {
          input.addEventListener("input", () => {
            const el = state.project.elements.find((item) => item.id === boundElementId);
            if (!el) return;
            const key = input.dataset.bind;
            let value = Number(input.value) || 0;

            if (key === "gridSpan") {
              el.gridSpan = clampGridSpan(value);
              el.gridCol = clampGridCol(el.gridCol || 1, el.gridSpan);
            } else if (key === "gridCol") {
              el.gridCol = clampGridCol(value, el.gridSpan || MIN_GRID_SPAN);
            } else if (key === "gridRow") {
              el.gridRow = clampGridRow(value);
            } else if (key === "rowSpan") {
              el.rowSpan = clampRowSpan(value);
            } else {
              el[key] = value;
            }

            saveStateToLocalStorage();
            renderCanvas();
            if (state.selectedId === boundElementId) {
              renderSettings();
            }
            updateComponentStats();
          });
        });

        settingsBody.querySelectorAll("[data-prop]").forEach((input) => {
          const applyPropValue = () => {
            const el = state.project.elements.find((item) => item.id === boundElementId);
            if (!el) return;

            const propName = input.dataset.prop;
            let value = input.value;

            if (propName === "checked") value = value === "true";
            if (
              [
                "fontSize",
                "fontWeight",
                "borderШирина",
                "radius",
                "activeIndex",
                "selectedIndex",
                "rows",
                "cols",
              ].includes(propName)
            ) {
              value = Number(value) || 0;
            }

            if (!el.props) el.props = {};
            if (typeof value === "string") {
              value = value.replace(/\n/g, "\\n");
            }
            el.props[propName] = value;

            if (el.type === "directory-tree" && propName === "title") {
              el.props.title = String(value);
            }

            saveStateToLocalStorage();
            renderCanvas();
            updateComponentStats();
          };

          input.addEventListener("input", applyPropValue);
          input.addEventListener("change", applyPropValue);
          input.addEventListener("blur", applyPropValue);
        });

        settingsBody.querySelectorAll("[data-canvas]").forEach((input) => {
          input.addEventListener("input", () => {
            let value = input.value;
            if (["width", "minHeight"].includes(input.dataset.canvas)) {
              value = Number(value) || 0;
            }
            state.project.canvas[input.dataset.canvas] = value;
            state.project.elements.forEach(normalizeElementToGrid);
            saveStateToLocalStorage();
            renderCanvas();
          });
        });
      }

      function startElementDrag(e) {
        if (e.button !== 0) return;
        if (e.target.classList.contains("resize")) return;
        const node = e.currentTarget;
        const id = node.dataset.id;
        const el = state.project.elements.find((item) => item.id === id);
        if (!el) return;
        normalizeElementToGrid(el);

        const multiModifier = e.ctrlKey || e.metaKey || e.shiftKey;
        if (multiModifier) {
          toggleSelection(id);
          renderCanvas();
          renderSettings();
          updateComponentStats();
          e.preventDefault();
          e.stopPropagation();
          return;
        }

        if (!getSelectedIds().includes(id)) {
          setSingleSelection(id);
        } else {
          state.selectedId = id;
        }

        const selectedElements = state.project.elements
          .filter((item) => getSelectedIds().includes(item.id))
          .map((item) => {
            normalizeElementToGrid(item);
            return {
              id: item.id,
              gridCol: item.gridCol,
              gridRow: item.gridRow,
              gridSpan: item.gridSpan,
              rowSpan: item.rowSpan,
            };
          });

        const rect = canvas.getBoundingClientRect();
        const startLeft = gridColToPixelX(el.gridCol);
        const startTop = gridRowToPixelY(el.gridRow);

        dragElementState = {
          id: el.id,
          startX: e.clientX,
          startY: e.clientY,
          startGridCol: el.gridCol,
          startGridRow: el.gridRow,
          startLeft,
          startTop,
          pointerOffsetX: e.clientX - rect.left - startLeft,
          pointerOffsetY: e.clientY - rect.top - startTop,
          elements: selectedElements,
        };
        dragStarted = false;

        renderSettings();
        updateComponentStats();
        renderCanvas();

        document.addEventListener("mousemove", onElementDrag);
        document.addEventListener("mouseup", stopElementDrag);
        e.preventDefault();
        e.stopPropagation();
      }

      function onElementDrag(e) {
        if (!dragElementState) return;
        const primary = state.project.elements.find(
          (item) => item.id === dragElementState.id,
        );
        if (!primary) return;
        normalizeElementToGrid(primary);

        const rect = canvas.getBoundingClientRect();
        const deltaX = e.clientX - dragElementState.startX;
        const deltaY = e.clientY - dragElementState.startY;
        dragStarted = dragStarted || Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2;

        const rawLeft = e.clientX - rect.left - dragElementState.pointerOffsetX;
        const rawTop = e.clientY - rect.top - dragElementState.pointerOffsetY;
        const desiredPrimaryCol = pixelXToGridCol(rawLeft, primary.gridSpan);
        const desiredPrimaryRow = pixelYToGridRow(rawTop);
        let colDelta = desiredPrimaryCol - dragElementState.startGridCol;
        let rowDelta = desiredPrimaryRow - dragElementState.startGridRow;

        const maxCanvasRow = Math.floor(state.project.canvas.minHeight / GRID_ROW_HEIGHT);
        const minColDelta = Math.max(...dragElementState.elements.map((item) => 1 - item.gridCol));
        const maxColDelta = Math.min(...dragElementState.elements.map((item) => GRID_COLUMNS - item.gridSpan + 1 - item.gridCol));
        const minRowDelta = Math.max(...dragElementState.elements.map((item) => 1 - item.gridRow));
        const maxRowDelta = Math.min(...dragElementState.elements.map((item) => maxCanvasRow - item.rowSpan + 1 - item.gridRow));

        colDelta = Math.max(minColDelta, Math.min(maxColDelta, colDelta));
        rowDelta = Math.max(minRowDelta, Math.min(maxRowDelta, rowDelta));

        let changed = false;
        dragElementState.elements.forEach((startItem) => {
          const item = state.project.elements.find((candidate) => candidate.id === startItem.id);
          if (!item) return;
          const nextCol = startItem.gridCol + colDelta;
          const nextRow = startItem.gridRow + rowDelta;
          if (item.gridCol !== nextCol || item.gridRow !== nextRow) {
            item.gridCol = nextCol;
            item.gridRow = nextRow;
            changed = true;
          }
        });

        if (changed) {
          renderCanvas();
          renderSettings();
          updateComponentStats();
        }
        e.preventDefault();
      }

      function stopElementDrag() {
        if (!dragElementState) return;
        document.removeEventListener("mousemove", onElementDrag);
        document.removeEventListener("mouseup", stopElementDrag);
        if (dragStarted) saveStateToLocalStorage();
        dragElementState = null;
        dragStarted = false;
      }

      function startResize(e) {
        e.stopPropagation();
        const node = e.currentTarget.parentElement;
        const el = state.project.elements.find(
          (item) => item.id === node.dataset.id,
        );
        if (!el) return;
        normalizeElementToGrid(el);

        resizeState = {
          id: el.id,
          startX: e.clientX,
          startSpan: el.gridSpan,
        };
        document.addEventListener("mousemove", onResize);
        document.addEventListener("mouseup", stopResize);
      }

      function onResize(e) {
        if (!resizeState) return;
        const el = selectedElement();
        if (!el || el.id !== resizeState.id) return;

        const grid = getGridMetrics();
        const deltaX = e.clientX - resizeState.startX;
        const spanDelta = Math.round(deltaX / grid.trackШирина);
        el.gridSpan = clampGridSpan(resizeState.startSpan + spanDelta);
        el.gridCol = clampGridCol(el.gridCol, el.gridSpan);

        renderCanvas();
        renderSettings();
        updateComponentStats();
      }

      function stopResize() {
        if (resizeState) {
          saveStateToLocalStorage();
        }
        resizeState = null;
        document.removeEventListener("mousemove", onResize);
        document.removeEventListener("mouseup", stopResize);
      }

      canvas.addEventListener("click", (e) => {
        if (e.target === canvas || e.target.classList.contains("drop-hint")) {
          setSingleSelection(null);
          renderCanvas();
          renderSettings();
          updateComponentStats();
        }
      });

      canvas.addEventListener("dragover", (e) => {
        e.preventDefault();
        canvas.classList.add("drag-over");
      });

      canvas.addEventListener("dragleave", () => {
        canvas.classList.remove("drag-over");
      });

      canvas.addEventListener("drop", (e) => {
        e.preventDefault();
        canvas.classList.remove("drag-over");
        const type = e.dataTransfer.getData("text/plain") || dragCatalogType;
        if (!type) return;
        const rect = canvas.getBoundingClientRect();
        const x = Math.round(e.clientX - rect.left + canvas.scrollLeft);
        const y = Math.round(e.clientY - rect.top + canvas.scrollTop - 20);
        addElement(type, Math.max(0, x), Math.max(0, y));
        dragCatalogType = null;
      });

      gridToggle.addEventListener("change", () => {
        state.project.canvas.showGrid = gridToggle.checked;
        saveStateToLocalStorage();
        renderCanvas();
      });

      document.getElementById("clearBtn").addEventListener("click", () => {
        if (!confirm("Очистити полотно? Незбережені зміни буде втрачено.")) {
          return;
        }
        state.project = structuredClone(DEFAULT_PROJECT);
        setCurrentProjectFileName("", true);
        setSingleSelection(null);
        zCounter = 1;
        saveStateToLocalStorage();
        renderCanvas();
        renderSettings();
        updateComponentStats();
      });

      deleteSelectedBtn.addEventListener("click", () => {
        deleteSelectedElement();
      });

      document.getElementById("saveBtn").addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        saveProject();
        return false;
      });
      fileInput.addEventListener("change", loadProject);

      function saveProject() {
        saveStateToLocalStorage();
        const snapshot = JSON.stringify(state.project, null, 2);
        const blob = new Blob([snapshot], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const safeName = (state.project.canvas.name || "prototype").replace(
          /[^a-z0-9_-]+/gi,
          "_",
        );
        const downloadFileName =
          currentProjectFileName || normalizeProjectFileName(safeName);

        const a = document.createElement("a");
        a.href = url;
        a.download = downloadFileName;
        a.rel = "noopener";
        a.style.display = "none";
        document.body.appendChild(a);

        setCurrentProjectFileName(downloadFileName);
        a.click();

        setTimeout(() => {
          if (a.parentNode) a.parentNode.removeChild(a);
          URL.revokeObjectURL(url);
        }, 300);
      }

      function loadProject(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (
              !parsed ||
              parsed.type !== "ui-prototype" ||
              !Array.isArray(parsed.elements)
            ) {
              throw new Error("Невірний формат файлу");
            }

            if (!parsed.canvas) parsed.canvas = {};
            parsed.canvas.width =
              parsed.canvas.width || DEFAULT_PROJECT.canvas.width;
            parsed.canvas.minHeight =
              parsed.canvas.minHeight || DEFAULT_PROJECT.canvas.minHeight;
            parsed.canvas.background = "#ffffff";
            parsed.canvas.name =
              parsed.canvas.name || DEFAULT_PROJECT.canvas.name;
            parsed.canvas.showGrid = !!parsed.canvas.showGrid;

            parsed.elements.forEach((el) => {
              normalizeElementToGrid(el);

              if (!el.props) el.props = {};
              if (!("borderШирина" in el.props))
                el.props.borderШирина = DEFAULT_BORDER_WIDTH;
              if (!("radius" in el.props)) el.props.radius = DEFAULT_RADIUS;
              if (
                [
                  "text-input",
                  "category-input",
                  "number-input",
                  "date-input",
                  "textarea",
                ].includes(el.type)
              ) {
                el.props = el.props || {};
                if (!("bgColor" in el.props)) el.props.bgColor = "#ffffff";
                if (!("borderColor" in el.props))
                  el.props.borderColor = "#000000";
                if (!("color" in el.props)) el.props.color = "#6b7280";
                if (!("borderШирина" in el.props))
                  el.props.borderШирина = DEFAULT_BORDER_WIDTH;
                if (!("radius" in el.props)) el.props.radius = DEFAULT_RADIUS;
                if (el.type === "number-input" && !("inputType" in el.props))
                  el.props.inputType = "number";
                if (el.type === "date-input" && !("inputType" in el.props))
                  el.props.inputType = "date";
                if (
                  el.type === "date-input" &&
                  (!Object.prototype.hasOwnProperty.call(
                    el.props,
                    "placeholder",
                  ) ||
                    String(el.props.placeholder ?? "").trim() === "")
                )
                  el.props.placeholder = "дд.мм.рррр";
                if (
                  el.type === "select" &&
                  !Object.prototype.hasOwnProperty.call(el.props, "placeholder")
                )
                  el.props.placeholder = "Оберіть";
                if (
                  el.type === "select" &&
                  (!Object.prototype.hasOwnProperty.call(el.props, "options") ||
                    String(el.props.options ?? "").trim() === "")
                )
                  el.props.options = "Опція 1\nОпція 2";
                if (el.type === "text-input" && !("inputType" in el.props))
                  el.props.inputType = "text";
              }
            });

            state.project = parsed;
            setCurrentProjectFileName(file.name);
            setSingleSelection(null);
            zCounter = Math.max(
              1,
              ...state.project.elements.map((el) => el.z || 1),
            );
            normalizeZ();
            saveStateToLocalStorage();
            renderCanvas();
            renderSettings();
            updateComponentStats();
          } catch (err) {
            alert("Не вдалося відкрити файл .json: " + err.message);
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      }

      function normalizeZ() {
        state.project.elements
          .sort((a, b) => a.z - b.z)
          .forEach((el, idx) => {
            el.z = idx + 1;
          });
        zCounter = state.project.elements.length;
      }

      function justifyFromAlign(align) {
        if (align === "center") return "center";
        if (align === "right") return "flex-end";
        return "flex-start";
      }

      function normalizeColor(color) {
        if (!color || color === "transparent") return "#ffffff";
        return color;
      }

      function isBorderHidden(color, width) {
        return (
          Number(width) <= 0 ||
          normalizeColor(color).toLowerCase() === "#ffffff"
        );
      }

      function getBorderCss(color, width, style = "solid") {
        return isBorderHidden(color, width)
          ? "none"
          : `${width}px ${style} ${color}`;
      }

      function getBorderSideCss(side, color, width, style = "solid") {
        return isBorderHidden(color, width)
          ? `${side}:none`
          : `${side}:${width}px ${style} ${color}`;
      }

      function escapeHtml(str = "") {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function escapeAttr(str = "") {
        return escapeHtml(str).replace(/\n/g, "&#10;");
      }

      // Використовуємо фізичні коди клавіш (KeyZ / KeyY), тому Undo/Redo
      // працює також з українською розкладкою клавіатури.
      document.addEventListener(
        "keydown",
        (e) => {
          const modifierPressed = e.ctrlKey || e.metaKey;
          if (!modifierPressed || e.altKey) return;

          const isZ = e.code === "KeyZ" || e.key.toLowerCase() === "z";
          const isY = e.code === "KeyY" || e.key.toLowerCase() === "y";

          if (isZ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            if (e.shiftKey) {
              redo();
            } else {
              undo();
            }
            return;
          }

          if (isY && !e.shiftKey) {
            e.preventDefault();
            e.stopImmediatePropagation();
            redo();
          }
        },
        true,
      );

      document.addEventListener("keydown", (e) => {
        const selectedIds = getSelectedIds();
        if (!selectedIds.length) return;
        if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;

        if ((e.key === "Delete" || e.key === "Backspace") && !e.ctrlKey && !e.metaKey) {
          e.preventDefault();
          deleteSelectedElement();
          return;
        }

        let colDelta = 0;
        let rowDelta = 0;
        if (e.key === "ArrowUp") rowDelta = -1;
        else if (e.key === "ArrowDown") rowDelta = 1;
        else if (e.key === "ArrowLeft") colDelta = -1;
        else if (e.key === "ArrowRight") colDelta = 1;
        else return;

        const elements = state.project.elements.filter((el) => selectedIds.includes(el.id));
        const maxCanvasRow = Math.floor(state.project.canvas.minHeight / GRID_ROW_HEIGHT);
        const canMove = elements.every((el) => {
          const nextCol = el.gridCol + colDelta;
          const nextRow = el.gridRow + rowDelta;
          return nextCol >= 1 && nextCol + el.gridSpan - 1 <= GRID_COLUMNS &&
            nextRow >= 1 && nextRow + el.rowSpan - 1 <= maxCanvasRow;
        });
        if (!canMove) return;

        elements.forEach((el) => {
          el.gridCol += colDelta;
          el.gridRow += rowDelta;
        });
        e.preventDefault();
        saveStateToLocalStorage();
        renderCanvas();
        renderSettings();
        updateComponentStats();
      });



      function getStoredPanelPins() {
        try {
          const raw = localStorage.getItem(PANEL_PIN_STORAGE_KEY);
          if (!raw) return { left: true, right: true };
          const parsed = JSON.parse(raw);
          return {
            left: typeof parsed.left === "boolean" ? parsed.left : true,
            right: typeof parsed.right === "boolean" ? parsed.right : true,
          };
        } catch (err) {
          console.warn("Не вдалося відновити стан Pin для панелей", err);
          return { left: true, right: true };
        }
      }

      function savePanelPins(pins) {
        try {
          localStorage.setItem(PANEL_PIN_STORAGE_KEY, JSON.stringify(pins));
        } catch (err) {
          console.warn("Не вдалося зберегти стан Pin для панелей", err);
        }
      }

      function applyPanelPins(pins) {
        const app = document.querySelector(".app");
        if (!app) return;

        app.classList.toggle("left-unpinned", !pins.left);
        app.classList.toggle("right-unpinned", !pins.right);

        document.querySelectorAll(".pin-toggle[data-pin-panel]").forEach((btn) => {
          const side = btn.dataset.pinPanel;
          const active = !!pins[side];
          btn.classList.toggle("active", active);
          btn.setAttribute("aria-pressed", String(active));
          btn.title = active ? "Відкріпити панель" : "Закріпити панель";
        });
      }

      function initPanelPins() {
        const pins = getStoredPanelPins();
        applyPanelPins(pins);

        document.querySelectorAll(".pin-toggle[data-pin-panel]").forEach((btn) => {
          btn.addEventListener("click", (evt) => {
            evt.preventDefault();
            evt.stopPropagation();

            const side = btn.dataset.pinPanel;
            const nextPins = getStoredPanelPins();
            nextPins[side] = !nextPins[side];
            savePanelPins(nextPins);
            applyPanelPins(nextPins);
          });
        });
      }

      restoreStateFromLocalStorage();
      initializeHistory();
      initPanelPins();
      restoreCurrentProjectFileName();
      renderCatalog();
      renderCanvas();
      renderSettings();
      updateComponentStats();

      function updateComponentStats() {
        const statsNode = document.getElementById("componentStats");
        if (!statsNode) return;
        statsNode.innerHTML = renderComponentStatsGrouped();
      }

      function switchApp(value) {
        if (value === "requirements") {
          window.location.href = "./editor-rtmatrix.html";
        } else if (value === "processes") {
          window.location.href = "./editor-hlprocess.html";
        }
      }

      window.addEventListener("beforeunload", () => {
        saveStateToLocalStorage();
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script>
      async function createCanvasScreenshotBlob() {
        const projectBackup = structuredClone(state.project);
        const selectedBackup = state.selectedId;
        const selectedIdsBackup = [...getSelectedIds()];
        const zBackup = zCounter;
        const canvasEl = document.getElementById("canvas");
        const screenshot = await html2canvas(canvasEl, {
          backgroundColor: "#ffffff",
          scale: 2,
          onclone: (clonedDoc) => {
            const clonedCanvas = clonedDoc.getElementById("canvas");
            if (clonedCanvas) {
              clonedCanvas.style.border = "2px solid #000000";
              clonedCanvas.style.borderRadius = "0";
            }
          },
        });

        const blob = await new Promise((resolve, reject) => {
          screenshot.toBlob((result) => {
            if (result) {
              resolve(result);
            } else {
              reject(new Error("Не вдалося створити PNG-файл."));
            }
          }, "image/png");
        });

        setTimeout(() => {
          const needsRestore =
            !Array.isArray(state.project.elements) ||
            state.project.elements.length !== projectBackup.elements.length;

          if (needsRestore) {
            state.project = structuredClone(projectBackup);
            state.selectedId = selectedBackup;
            state.selectedIds = selectedIdsBackup;
            zCounter = zBackup;
            renderCanvas();
            renderSettings();
            updateComponentStats();
          }
        }, 0);

        return blob;
      }

      document
        .getElementById("screenshotBtn")
        .addEventListener("click", async (e) => {
          e.preventDefault();
          e.stopPropagation();

          try {
            const blob = await createCanvasScreenshotBlob();
            const link = document.createElement("a");
            link.download = "mockup.png";
            link.href = URL.createObjectURL(blob);
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
          } catch (error) {
            console.error(error);
            alert("Не вдалося створити скріншот полотна.");
          }

          return false;
        });

      document.getElementById("screenBtn").addEventListener("click", async (e) => {
        e.preventDefault();
        e.stopPropagation();

        if (!navigator.clipboard || typeof window.ClipboardItem === "undefined") {
          alert("Буфер обміну зображень не підтримується у цьому браузері.");
          return false;
        }

        try {
          const blob = await createCanvasScreenshotBlob();
          await navigator.clipboard.write([
            new ClipboardItem({
              "image/png": blob,
            }),
          ]);
          alert("Скріншот полотна скопійовано. Тепер можна вставити його через Ctrl+V.");
        } catch (error) {
          console.error(error);
          alert("Не вдалося скопіювати скріншот у буфер обміну.");
        }

        return false;
      });
    </script>
