<!doctype html>

<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Редактор мокапів</title>
    <style>
      :root {
        --bg: #f3f4f6;
        --panel: #ffffff;
        --line: #d1d5db;
        --text: #111827;
        --muted: #6b7280;
        --accent: #f97316;
        --accent-soft: #fff7ed;
        --canvas: #ffffff;
        --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      *,
      *::before,
      *::after {
        font-family: inherit;
      }

      input,
      textarea,
      select,
      button,
      option {
        font-family: inherit;
      }

      ::placeholder {
        font-family: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: 290px 1fr 320px;
        height: 100vh;
        overflow: hidden;
      }

      .panel {
        background: var(--panel);
        border-right: 1px solid var(--line);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .panel.right {
        border-right: none;
        border-left: 1px solid var(--line);
      }

      .panel-header {
        padding: 16px 16px 10px;
        border-bottom: 1px solid var(--line);
      }

      .panel-title {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 10px;
      }



      .panel.left,
      .panel.right {
        position: relative;
        z-index: 10;
        transition: width 0.18s ease, box-shadow 0.18s ease;
      }

      .panel.left {
        width: 290px;
      }

      .panel.right {
        width: 320px;
      }

      .panel-header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .panel-header-row .panel-title {
        margin: 0;
      }

      .pin-toggle {
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #ffffff;
        color: #6b7280;
        font-size: 17px;
        line-height: 1;
        box-shadow: none;
        filter: grayscale(100%);
      }

      .pin-toggle:hover {
        filter: none;
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent);
      }

      .pin-toggle.active {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent);
        filter: none;
      }

      .app.left-unpinned {
        grid-template-columns: 44px 1fr 320px;
      }

      .app.right-unpinned {
        grid-template-columns: 290px 1fr 44px;
      }

      .app.left-unpinned.right-unpinned {
        grid-template-columns: 44px 1fr 44px;
      }

      .app.left-unpinned .panel.left,
      .app.right-unpinned .panel.right {
        width: 44px;
        overflow: hidden;
        cursor: default;
      }

      .app.left-unpinned .panel.left:hover,
      .app.left-unpinned .panel.left:focus-within {
        width: 290px;
        box-shadow: var(--shadow);
      }

      .app.right-unpinned .panel.right:hover,
      .app.right-unpinned .panel.right:focus-within {
        width: 320px;
        box-shadow: var(--shadow);
      }

      .app.left-unpinned .panel.left .component-list,
      .app.left-unpinned .panel.left #deleteSelectedBtn,
      .app.left-unpinned .panel.left .footer-note,
      .app.right-unpinned .panel.right .settings-body,
      .app.right-unpinned .panel.right .footer-note {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s ease;
      }

      .app.left-unpinned .panel.left:hover .component-list,
      .app.left-unpinned .panel.left:focus-within .component-list,
      .app.left-unpinned .panel.left:hover #deleteSelectedBtn,
      .app.left-unpinned .panel.left:focus-within #deleteSelectedBtn,
      .app.left-unpinned .panel.left:hover .footer-note,
      .app.left-unpinned .panel.left:focus-within .footer-note,
      .app.right-unpinned .panel.right:hover .settings-body,
      .app.right-unpinned .panel.right:focus-within .settings-body,
      .app.right-unpinned .panel.right:hover .footer-note,
      .app.right-unpinned .panel.right:focus-within .footer-note {
        opacity: 1;
        pointer-events: auto;
      }

      .app.left-unpinned .panel.left .panel-header,
      .app.right-unpinned .panel.right .panel-header {
        height: 100vh;
        padding: 12px 4px;
        border-bottom: none;
      }

      .app.left-unpinned .panel.left:hover .panel-header,
      .app.left-unpinned .panel.left:focus-within .panel-header,
      .app.right-unpinned .panel.right:hover .panel-header,
      .app.right-unpinned .panel.right:focus-within .panel-header {
        height: auto;
        padding: 16px 16px 10px;
        border-bottom: 1px solid var(--line);
      }

      .app.left-unpinned .panel.left .panel-header-row,
      .app.right-unpinned .panel.right .panel-header-row {
        height: 100%;
        flex-direction: column;
        justify-content: flex-start;
      }

      .app.left-unpinned .panel.left:hover .panel-header-row,
      .app.left-unpinned .panel.left:focus-within .panel-header-row,
      .app.right-unpinned .panel.right:hover .panel-header-row,
      .app.right-unpinned .panel.right:focus-within .panel-header-row {
        height: auto;
        flex-direction: row;
      }

      .app.left-unpinned .panel.left .panel-title,
      .app.right-unpinned .panel.right .panel-title {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        font-size: 16px;
        white-space: nowrap;
        margin-top: 8px;
      }

      .app.left-unpinned .panel.left:hover .panel-title,
      .app.left-unpinned .panel.left:focus-within .panel-title,
      .app.right-unpinned .panel.right:hover .panel-title,
      .app.right-unpinned .panel.right:focus-within .panel-title {
        writing-mode: horizontal-tb;
        transform: none;
        font-size: 22px;
        margin-top: 0;
      }

      .app.left-unpinned .panel.left .pin-toggle,
      .app.right-unpinned .panel.right .pin-toggle {
        width: 34px;
        height: 34px;
      }

      .component-list,
      .settings-body {
        padding: 14px;
        overflow-y: auto;
        overflow-x: hidden;
        flex: 1;
        min-height: 0;
      }

      .group-title {
        font-size: 13px;
        font-weight: 700;
        color: #374151;
        margin: 14px 0 10px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .components-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .component-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 6px 8px;
        min-height: 38px;
        cursor: grab;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        transition: 0.15s ease;
        user-select: none;
      }

      .component-card:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
        background: var(--accent-soft);
      }

      .component-icon {
        width: 32px;
        height: 24px;
        border: 2px solid #374151;
        border-radius: 5px;
        margin-bottom: 10px;
        position: relative;
      }

      .component-icon.textarea,
      .component-icon.number-input,
      .component-icon.date-input {
        height: 28px;
      }

      .component-icon.button {
        border-radius: 999px;
        width: 36px;
        height: 24px;
        background: #e5e7eb;
      }

      .component-icon.heading::before,
      .component-icon.paragraph::before,
      .component-icon.image::before,
      .component-icon.card::before,
      .component-icon.section::before,
      .component-icon.checkbox::before,
      .component-icon.select::before,
      .component-icon.form::before,
      .component-icon.text-input::before,
      .component-icon.number-input::before,
      .component-icon.date-input::before,
      .component-icon.radio-buttons::before {
        content: "";
        position: absolute;
        inset: 4px;
        border: 1px dashed #6b7280;
        border-radius: 4px;
      }

      .component-name {
        font-size: 13px;
        line-height: 1.2;
        font-weight: 400;
        color: #111827;
      }

      .workspace-wrap {
        display: flex;
        flex-direction: column;
        min-width: 0;
        height: 100vh;
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        height: 67px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        flex-wrap: nowrap;
      }

      .topbar .title {
        display: flex;
        align-items: center;
        height: 40px;
        font-weight: 700;
        margin-right: auto;
        min-width: 0;
        overflow: hidden;
      }

      .current-file-name {
        display: block;
        max-width: min(42vw, 620px);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #374151;
        font-size: 14px;
        font-weight: 600;
      }

      .current-file-name.unsaved {
        color: var(--muted);
        font-weight: 500;
      }

      .grid-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 4px;
        font-size: 14px;
        font-weight: 400;
        color: var(--text);
        white-space: nowrap;
        user-select: none;
      }

      .grid-toggle input {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: #2563eb;
        cursor: pointer;
      }

      button,
      .file-label {
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 40px;
        border: none;
        color: var(--text);
        padding: 0 16px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 400;
        line-height: 1;
        color: #ffffff;
        cursor: pointer;
        transition: 0.15s ease;
        text-decoration: none;
        white-space: nowrap;
      }

      button:hover,
      .file-label:hover {
        filter: brightness(0.96);
      }

      button:disabled,
      .file-label:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        filter: none;
      }

      .btn-red {
        background: #ef4444;
        color: #ffffff;
      }

      .btn-yellow {
        background: #f59e0b;
        color: #ffffff;
      }

      .btn-green {
        background: #15803d;
        color: #ffffff;
      }

      #fileInput {
        display: none;
      }

      .workspace {
        position: relative;
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 16px;
        background:
          linear-gradient(
            to right,
            rgba(107, 114, 128, 0.03) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(107, 114, 128, 0.03) 1px,
            transparent 1px
          ),
          var(--bg);
        background-size: 20px 20px;
        min-height: 0;
      }

      .canvas-shell {
        position: relative;
        display: grid;
        grid-template-columns: 40px auto;
        grid-template-rows: 28px auto;
        width: max-content;
        min-width: 0;
      }

      .grid-corner {
        grid-column: 1;
        grid-row: 1;
      }

      .grid-cols-labels {
        grid-column: 2;
        grid-row: 1;
        position: relative;
        height: 28px;
        pointer-events: none;
      }

      .grid-col-label {
        position: absolute;
        top: 4px;
        transform: translateX(-50%);
        font-size: 14px;
        color: #9ca3af;
        background: rgba(255, 255, 255, 0.9);
        padding: 1px 4px;
        border-radius: 4px;
        line-height: 1.2;
        white-space: nowrap;
      }

      .grid-rows-labels {
        grid-column: 1;
        grid-row: 2;
        position: relative;
        width: 40px;
        pointer-events: none;
        overflow: hidden;
      }

      .grid-row-label {
        position: absolute;
        right: 6px;
        transform: translateY(-50%);
        font-size: 14px;
        color: #9ca3af;
        background: rgba(255, 255, 255, 0.9);
        padding: 1px 4px;
        border-radius: 4px;
        line-height: 1.2;
        white-space: nowrap;
      }

      .canvas {
        max-width: 100%;
        position: relative;
        min-height: 100%;
        background: #ffffff;
        border: 2px dashed #d1d5db;
        border-radius: 18px;
        box-shadow: var(--shadow);
        overflow: visible;
      }

      .canvas.empty {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .empty-state {
        text-align: center;
        color: #374151;
        max-width: 420px;
        padding: 32px;
      }

      .empty-state .marker {
        width: 54px;
        height: 54px;
        margin: 0 auto 18px;
        border: 4px dashed var(--accent);
        border-radius: 10px;
      }

      .drop-hint {
        position: absolute;
        inset: 0;
        pointer-events: none;
        border: 3px dashed transparent;
        border-radius: 18px;
        z-index: 1;
      }

      .canvas.drag-over .drop-hint {
        border-color: var(--accent);
        background: rgba(249, 115, 22, 0.05);
      }

      .grid-overlay {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 20px;
        padding: 0 20px;
      }

      .grid-overlay .grid-column {
        height: 100%;
        background: rgba(107, 114, 128, 0.04);
        border-left: 1px solid rgba(107, 114, 128, 0.08);
        border-right: 1px solid rgba(107, 114, 128, 0.08);
      }

      .grid-row {
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background: rgba(55, 65, 81, 0.08);
      }

      .canvas-element {
        position: absolute;
        min-width: 70px;
        min-height: 30px;
        border: 1px solid transparent;
        padding: 0;
        border-radius: 10px;
        cursor: move;
        z-index: 2;
        overflow: visible;
      }

      .canvas-element.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
        background: rgba(255, 255, 255, 0.8);
      }

      .canvas-element .resize {
        position: absolute;
        width: 12px;
        height: 12px;
        right: -6px;
        bottom: -6px;
        background: var(--accent);
        border-radius: 50%;
        cursor: ew-resize;
        display: none;
      }

      .canvas-element.selected .resize {
        display: block;
      }

      .canvas-element input,
      .canvas-element textarea,
      .canvas-element select,
      .canvas-element button {
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .canvas-element input::placeholder,
      .canvas-element textarea::placeholder {
        color: var(--placeholder-color, #9ca3af);
        opacity: 1;
        font-size: 13px;
      }

      input[type="number"] {
        appearance: auto;
        -moz-appearance: auto;
      }

      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: auto;
        margin: 0;
        opacity: 1;
      }

      .canvas-element input[type="number"] {
        appearance: textfield;
        -moz-appearance: textfield;
      }

      .canvas-element input[type="number"]::-webkit-outer-spin-button,
      .canvas-element input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
        opacity: 0;
      }

      .proto-field {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .proto-field-label {
        position: absolute;
        top: -18px; /* більша відстань */
        left: 10px;
        font-size: 14px; /* більший текст */
        line-height: 1;
        color: #000000;
        background: #ffffff;
        padding: 0 4px;
        margin: 0;
        pointer-events: none;
        z-index: 3;
        white-space: nowrap;
      }

      .proto-field-input {
        width: 100%;
        height: 100%;
        display: block;
        box-sizing: border-box;
        font-family: inherit;
      }

      .proto-field-textarea .proto-field-input {
        resize: none;
      }

      .textarea-corner-mark {
        position: absolute;
        right: 6px;
        bottom: 4px;
        width: 12px;
        height: 12px;
        pointer-events: none;
        opacity: 0.75;
        background:
          linear-gradient(
            -45deg,
            transparent 0 52%,
            currentColor 52% 60%,
            transparent 60% 100%
          ),
          linear-gradient(
            -45deg,
            transparent 0 22%,
            currentColor 22% 30%,
            transparent 30% 100%
          );
      }

      .canvas-element .card-ui,
      .canvas-element .section-ui,
      .canvas-element .form-ui {
        width: 100%;
        height: 100%;
        background: white;
        border: 1px solid #d1d5db;
        border-radius: 14px;
        padding: 14px;
      }

      .radio-group-ui {
        width: 100%;
        height: 100%;
        display: flex;
        gap: 14px;
        align-items: flex-start;
        justify-content: flex-start;
      }

      .radio-group-ui.vertical {
        flex-direction: column;
      }

      .radio-group-ui.horizontal {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .radio-option-ui {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 24px;
        color: inherit;
        font-size: 14px;
        white-space: nowrap;
      }

      .radio-option-ui input[type="radio"] {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: #f97316;
        pointer-events: none;
      }

      .canvas-element .section-ui {
        background: #f9fafb;
        border-style: dashed;
      }

      .canvas-element .image-ui {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        border: 1px dashed #9ca3af;
        background: linear-gradient(135deg, #e5e7eb, #f9fafb);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6b7280;
        font-size: 14px;
        text-align: center;
        padding: 12px;
      }

      .settings-body label {
        display: block;
        font-size: 14px;
        color: #374151;
        font-weight: 700;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .field {
        margin-bottom: 14px;
      }

      .field input,
      .field select,
      .field textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 13px;
        outline: none;
        background: white;
      }

      .field textarea {
        min-height: 84px;
        resize: vertical;
      }

      .muted {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .settings-placeholder {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
        padding: 12px;
        border: 1px dashed var(--line);
        border-radius: 12px;
        background: #f9fafb;
      }

      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .footer-note {
        padding: 10px 14px 16px;
        color: var(--muted);
        font-size: 12px;
        border-top: 1px solid var(--line);
      }

      .color-palette {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 8px;
      }

      .color-swatch {
        width: 100%;
        height: 28px;
        border-radius: 6px;
        cursor: pointer;
        border: 1px solid rgba(17, 24, 39, 0.18);
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease;
        padding: 0;
      }

      .color-swatch:hover {
        transform: scale(1.04);
      }

      .color-swatch.active {
        outline: 3px solid #111827;
        outline-offset: 1px;
      }

      @media (max-width: 1200px) {
        .app {
          grid-template-columns: 250px 1fr 290px;
        }
      }

      @media (max-width: 980px) {
        .app {
          grid-template-columns: 1fr;
        }

        .panel.left,
        .panel.right {
          display: none;
        }

        .app.left-unpinned,
        .app.right-unpinned,
        .app.left-unpinned.right-unpinned {
          grid-template-columns: 1fr;
        }

        .workspace-wrap {
          min-width: 0;
        }

        body {
          overflow: hidden;
        }

        .topbar {
          height: auto;
          flex-wrap: wrap;
        }
      }

      .canvas-element select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
      }

      .canvas-element select::-ms-expand {
        display: none;
      }
    

      /* Pin layout fix: pinned panels occupy their grid columns; unpinned panels use a 44px rail and expand as overlays on hover without shifting the mockup. */
      .panel.left,
      .panel.right {
        width: 100%;
        min-width: 0;
      }

      .app.left-unpinned .panel.left,
      .app.right-unpinned .panel.right {
        width: 44px;
      }

      .app.left-unpinned .panel.left:hover,
      .app.left-unpinned .panel.left:focus-within {
        width: 290px;
      }

      .app.right-unpinned .panel.right {
        justify-self: end;
      }

      .app.right-unpinned .panel.right:hover,
      .app.right-unpinned .panel.right:focus-within {
        width: 320px;
      }

      @media (max-width: 1200px) {
        .app.left-unpinned .panel.left:hover,
        .app.left-unpinned .panel.left:focus-within {
          width: 250px;
        }

        .app.right-unpinned .panel.right:hover,
        .app.right-unpinned .panel.right:focus-within {
          width: 290px;
        }
      }

      const GRID_COLUMNS = 12;
      const GRID_GAP = 20;
      const GRID_PADDING = 20;
      const GRID_ROW_HEIGHT = 27;
      const MIN_GRID_SPAN = 1;
      const MIN_ROW_SPAN = 1;

      const COLOR_SWATCHES = [
        { name: "Червоний", value: "#ef4444" },

      ];

      const DEFAULT_PROJECT = {
        version: "1.0",
        type: "ui-prototype",
        canvas: {
          width: 1220,
          minHeight: 760,
          background: "#ffffff",
          name: "mockup",
          showGrid: false,
        },
        elements: [],
      };

      const STORAGE_KEY = "ui-modeler-autosave";
      const PANEL_PIN_STORAGE_KEY = "ui-modeler-panel-pins";
      const CURRENT_FILE_NAME_STORAGE_KEY = "ui-modeler-current-file-name";

      const state = {
        project: structuredClone(DEFAULT_PROJECT),
        selectedId: null,
        selectedIds: [],
        search: "",
      };

      function getSelectedIds() {
        const existingIds = new Set(state.project.elements.map((el) => el.id));
        state.selectedIds = (Array.isArray(state.selectedIds) ? state.selectedIds : [])
          .filter((id, index, arr) => existingIds.has(id) && arr.indexOf(id) === index);
        if (state.selectedId && existingIds.has(state.selectedId) && !state.selectedIds.includes(state.selectedId)) {
          state.selectedIds.push(state.selectedId);
        }
        if (!state.selectedId || !existingIds.has(state.selectedId)) {
          state.selectedId = state.selectedIds[0] || null;
        }
        return state.selectedIds;
      }

      function setSingleSelection(id) {
        state.selectedId = id || null;
        state.selectedIds = id ? [id] : [];
      }

      function toggleSelection(id) {
        const selected = getSelectedIds();
        if (selected.includes(id)) {
          state.selectedIds = selected.filter((itemId) => itemId !== id);
          if (state.selectedId === id) state.selectedId = state.selectedIds[0] || null;
        } else {
          state.selectedIds = [...selected, id];
          state.selectedId = id;
        }
      }

      let currentProjectFileName = "";

      function normalizeProjectFileName(fileName) {
        const trimmed = String(fileName || "").trim();
        if (!trimmed) return "";
        return /\.json$/i.test(trimmed) ? trimmed : trimmed + ".json";
      }

      function setCurrentProjectFileName(fileName, isNew = false) {
        currentProjectFileName = isNew
          ? ""
          : normalizeProjectFileName(fileName);

        try {
          if (currentProjectFileName) {
            localStorage.setItem(
              CURRENT_FILE_NAME_STORAGE_KEY,
              currentProjectFileName,
            );
          } else {
            localStorage.removeItem(CURRENT_FILE_NAME_STORAGE_KEY);
          }
        } catch (err) {
          console.warn("Не вдалося зберегти назву поточного файлу", err);
        }

        const displayName = currentProjectFileName || "новий макет";
        currentFileName.textContent = `Файл: ${displayName}`;
        currentFileName.title = currentProjectFileName

          : "Редактор мокапів — новий макет";
      }

      function restoreCurrentProjectFileName() {
        try {
          const storedFileName = localStorage.getItem(

          setCurrentProjectFileName(storedFileName || "", !storedFileName);

      let dragCatalogType = null;

      function getGridMetrics() {
        const totalGap = GRID_GAP * (GRID_COLUMNS - 1);
        const innerШирина = state.project.canvas.width - GRID_PADDING * 2;
        const columnШирина = (innerШирина - totalGap) / GRID_COLUMNS;
        return {
          columns: GRID_COLUMNS,
          gap: GRID_GAP,
          padding: GRID_PADDING,
          innerШирина,
          columnШирина,
          trackШирина: columnШирина + GRID_GAP,
        };
      }

      function clampGridCol(col, span) {
        return Math.max(1, Math.min(GRID_COLUMNS - span + 1, col));
      }

      function clampGridSpan(span) {
        return Math.max(MIN_GRID_SPAN, Math.min(GRID_COLUMNS, span));
      }

      function clampGridRow(row) {
        return Math.max(1, row);
      }

      function clampRowSpan(span) {
        return Math.max(MIN_ROW_SPAN, span);
      }

      function pixelШиринаToGridSpan(pxШирина) {
        const grid = getGridMetrics();
        const raw = (pxШирина + grid.gap) / grid.trackШирина;
        return clampGridSpan(Math.round(raw));
      }

      function pixelXToGridCol(x, span) {
        const grid = getGridMetrics();
        const raw = (x - grid.padding) / grid.trackШирина;
        return clampGridCol(Math.round(raw) + 1, span);
      }

      function gridColToPixelX(col) {
        const grid = getGridMetrics();
        return Math.round(grid.padding + (col - 1) * grid.trackШирина);
      }

      function gridSpanToPixelШирина(span) {
        const grid = getGridMetrics();
        return Math.round(span * grid.columnШирина + (span - 1) * grid.gap);
      }

      function pixelYToGridRow(y) {
        return clampGridRow(Math.round(y / GRID_ROW_HEIGHT) + 1);
      }

      function gridRowToPixelY(row) {
        return Math.round((row - 1) * GRID_ROW_HEIGHT);
      }

      function pixelHeightToRowSpan(pxHeight) {
        return clampRowSpan(Math.round(pxHeight / GRID_ROW_HEIGHT));
      }

      function rowSpanToPixelHeight(span) {
        return Math.round(span * GRID_ROW_HEIGHT);
      }

      function normalizeElementToGrid(el) {
        if (!el.gridSpan) {
          el.gridSpan = pixelШиринаToGridSpan(el.w || 240);
        }
        el.gridSpan = clampGridSpan(el.gridSpan);

        if (!el.gridCol) {
          el.gridCol = pixelXToGridCol(el.x || GRID_PADDING, el.gridSpan);
        }
        el.gridCol = clampGridCol(el.gridCol, el.gridSpan);

        if (!el.gridRow) {
          el.gridRow = pixelYToGridRow(typeof el.y === "number" ? el.y : 40);
        }
        el.gridRow = clampGridRow(el.gridRow);

        if (!el.rowSpan) {
          el.rowSpan = pixelHeightToRowSpan(
            typeof el.h === "number" ? el.h : 120,
          );
        }
        el.rowSpan = clampRowSpan(el.rowSpan);

        delete el.x;
        delete el.w;
        delete el.y;
        delete el.h;
      }
